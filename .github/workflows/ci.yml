name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axiom_test
          POSTGRES_PASSWORD: axiom_test
          POSTGRES_DB: axiom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 6

    env:
      # Dummy fallbacks so AxiomConfig's validator passes at import time.
      # Tests stub out all network calls; real keys are not required for the suite.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'ci-dummy-anthropic-key' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'ci-dummy-openai-key' }}
      POSTGRES_URL: postgresql+psycopg://axiom_test:axiom_test@localhost:5432/axiom_test
      DATABASE_URL: postgresql+asyncpg://axiom_test:axiom_test@localhost:5432/axiom_test
      POSTGRES_USER: axiom_test
      POSTGRES_PASSWORD: axiom_test
      POSTGRES_DB: axiom_test
      REDIS_PASSWORD: ""
      # Protected endpoints fail closed (503) when API_KEY is unset, so the
      # test suite runs with a key configured.
      API_KEY: test-api-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y libmagic1

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Download NLTK data
        working-directory: backend
        run: python -c "import nltk; nltk.download('punkt_tab', quiet=True)"

      - name: Run backend tests
        working-directory: backend
        run: pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: http://localhost:8000
        run: npm run build

      - name: Confirm no source maps in build
        working-directory: frontend
        run: |
          if find build/static/js -name "*.map" | grep -q .; then
            echo "ERROR: source maps found in build output"
            exit 1
          fi
          echo "No source maps found. Build is clean."

  frontend-tests:
    name: Frontend Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npx eslint src --ext .js,.jsx

      - name: Vitest streaming UI tests
        working-directory: frontend
        run: npx vitest run

  backend-lint:
    name: Backend Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.16.8

      - name: Ruff lint (backend)
        run: ruff check backend/

  backend-typecheck:
    name: Backend mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy==2.3.1 types-passlib

      - name: mypy
        run: mypy .

  migrations-fresh-db:
    name: Alembic fresh-database verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axiom_test
          POSTGRES_PASSWORD: axiom_test
          POSTGRES_DB: axiom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://axiom_test:axiom_test@localhost:5432/axiom_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Light install: only what alembic + the scratch-DB tests import.
      # httpx: tests/conftest.py imports ASGITransport/AsyncClient at module
      # level, so any pytest run under tests/ requires it.
      - name: Install migration-test dependencies
        run: |
          pip install --upgrade pip
          pip install alembic sqlalchemy asyncpg python-dotenv pytest pytest-asyncio httpx

      - name: Verify fresh-database schema from migrations
        run: pytest tests/test_migrations.py -v

  frontend-lint:
    name: Frontend ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  eval-gate:
    name: Eval regression gate (deterministic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The gate is hermetic: every model seam is stubbed (classification,
      # generation, RAGAS critic, embeddings, vector store, reranker, cache),
      # so no PostgreSQL/Redis services are needed — but AxiomConfig still
      # validates that POSTGRES_URL is PRESENT at import time, so a dummy
      # URL (never connected to) is required for the import to pass.
      ANTHROPIC_API_KEY: ci-dummy-anthropic-key
      OPENAI_API_KEY: ci-dummy-openai-key
      POSTGRES_URL: postgresql+psycopg://dummy:dummy@localhost:5432/dummy
      REDIS_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download NLTK data
        run: python -c "import nltk; nltk.download('punkt_tab', quiet=True)"

      - name: Run stubbed eval suite
        run: python scripts/eval_gate.py run --output /tmp/eval_results.json

      - name: Assert no regression below committed thresholds
        run: python scripts/eval_gate.py check --results /tmp/eval_results.json

  s3-connector-integration:
    name: S3 connector (MinIO integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ANTHROPIC_API_KEY: ci-dummy-anthropic-key
      OPENAI_API_KEY: ci-dummy-openai-key
      POSTGRES_URL: postgresql+psycopg://dummy:dummy@localhost:5432/dummy
      DATABASE_URL: postgresql+asyncpg://dummy:dummy@localhost:5432/dummy
      REDIS_PASSWORD: ""
      API_KEY: test-api-key
      # Real S3 wire credentials for the integration test (MinIO below). The
      # test skips itself when S3_BUCKET is unset, so this stays CI-only.
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_BUCKET: axiom-test
      S3_ACCESS_KEY_ID: axiomci
      S3_SECRET_ACCESS_KEY: axiomci-secret
      S3_REGION: us-east-1
      S3_RECURSIVE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start MinIO and create the bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=axiomci \
            -e MINIO_ROOT_PASSWORD=axiomci-secret \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9000/minio/health/live
          docker run --rm --network host quay.io/minio/mc alias set local http://127.0.0.1:9000 axiomci axiomci-secret
          docker run --rm --network host quay.io/minio/mc mb local/axiom-test

      - name: Upload the digital fixture as a connector object
        run: |
          docker run --rm --network host -v "$GITHUB_WORKSPACE/backend/tests/fixtures/pdf:/fixtures:ro" \
            quay.io/minio/mc cp /fixtures/quarterly_report_table.pdf local/axiom-test/reports/quarterly_report_table.pdf

      - name: Run the S3 integration tests against MinIO
        run: pytest tests/test_s3_integration.py -v --tb=short

  ocr-extra-smoke:
    name: Docling OCR extra (Python 3.11 installability)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ANTHROPIC_API_KEY: ci-dummy-anthropic-key
      OPENAI_API_KEY: ci-dummy-openai-key
      POSTGRES_URL: postgresql+psycopg://dummy:dummy@localhost:5432/dummy
      REDIS_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11 (CI runtime — not the 3.13 local venv)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install the package with the ocr extra (hard gate)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e '.[ocr]'

      - name: Probe the OCR adapter on Python 3.11 (hard gate)
        run: |
          python - <<'EOF'
          from axiom.ingest.ocr import is_ocr_available
          assert is_ocr_available(), "docling installed but the adapter probe failed"
          print("Docling adapter probe OK on Python 3.11")
          EOF

      # Confidence signal, not an installability gate: a real conversion of the
      # scanned fixture proves the extra works end to end. Model weights come
      # from HuggingFace, so this step is allowed to fail on network flake
      # without failing installability (which the two steps above gate).
      - name: Convert the scanned fixture end to end (best effort)
        continue-on-error: true
        run: |
          python - <<'EOF'
          from axiom.ingest.ocr import parse_pdf_ocr
          pages = parse_pdf_ocr("tests/fixtures/pdf/scanned_invoice.pdf")
          assert pages, "OCR conversion produced no pages"
          text = "\n".join(p["text"] for p in pages)
          assert "INVOICE" in text.upper(), f"OCR text missing invoice marker: {text[:200]!r}"
          print(f"OCR conversion smoke OK: {len(pages)} page(s)")
          EOF
