name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axiom_test
          POSTGRES_PASSWORD: axiom_test
          POSTGRES_DB: axiom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 6

    env:
      # Dummy fallbacks so AxiomConfig's validator passes at import time.
      # Tests stub out all network calls; real keys are not required for the suite.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'ci-dummy-anthropic-key' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'ci-dummy-openai-key' }}
      POSTGRES_URL: postgresql+psycopg://axiom_test:axiom_test@localhost:5432/axiom_test
      DATABASE_URL: postgresql+asyncpg://axiom_test:axiom_test@localhost:5432/axiom_test
      POSTGRES_USER: axiom_test
      POSTGRES_PASSWORD: axiom_test
      POSTGRES_DB: axiom_test
      REDIS_PASSWORD: ""
      # Protected endpoints fail closed (503) when API_KEY is unset, so the
      # test suite runs with a key configured.
      API_KEY: test-api-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get install -y libmagic1

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Download NLTK data
        working-directory: backend
        run: python -c "import nltk; nltk.download('punkt_tab', quiet=True)"

      - name: Run backend tests
        working-directory: backend
        run: pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: http://localhost:8000
        run: npm run build

      - name: Confirm no source maps in build
        working-directory: frontend
        run: |
          if find build/static/js -name "*.map" | grep -q .; then
            echo "ERROR: source maps found in build output"
            exit 1
          fi
          echo "No source maps found. Build is clean."

  backend-lint:
    name: Backend Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.16.8

      - name: Ruff lint (backend)
        run: ruff check backend/

  backend-typecheck:
    name: Backend mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy==2.3.1 types-passlib

      - name: mypy
        run: mypy .

  migrations-fresh-db:
    name: Alembic fresh-database verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axiom_test
          POSTGRES_PASSWORD: axiom_test
          POSTGRES_DB: axiom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://axiom_test:axiom_test@localhost:5432/axiom_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Light install: only what alembic + the scratch-DB tests import.
      # httpx: tests/conftest.py imports ASGITransport/AsyncClient at module
      # level, so any pytest run under tests/ requires it.
      - name: Install migration-test dependencies
        run: |
          pip install --upgrade pip
          pip install alembic sqlalchemy asyncpg python-dotenv pytest pytest-asyncio httpx

      - name: Verify fresh-database schema from migrations
        run: pytest tests/test_migrations.py -v

  frontend-lint:
    name: Frontend ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint
