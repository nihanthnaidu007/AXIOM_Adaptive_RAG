name: Nightly RAGAS Eval

# Real RAGAS evaluation with a live critic, run against real services.
# Deliberately NEVER a PR gate — the PR gate is the deterministic, LLM-free
# eval-gate job in ci.yml. This workflow surfaces drift in LLM-judged scores
# (faithfulness / relevancy / groundedness) that the deterministic gate
# cannot see, and records real runs into the PG-backed eval_runs history
# the /eval dashboard renders.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  ragas-eval:
    name: Real RAGAS eval (live critic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axiom_test
          POSTGRES_PASSWORD: axiom_test
          POSTGRES_DB: axiom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 6

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      POSTGRES_URL: postgresql+psycopg://axiom_test:axiom_test@localhost:5432/axiom_test
      DATABASE_URL: postgresql+asyncpg://axiom_test:axiom_test@localhost:5432/axiom_test
      POSTGRES_USER: axiom_test
      POSTGRES_PASSWORD: axiom_test
      POSTGRES_DB: axiom_test
      REDIS_PASSWORD: ""
      API_KEY: test-api-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download NLTK data
        run: python -c "import nltk; nltk.download('punkt_tab', quiet=True)"

      # The scheduled run has no pre-indexed content: seed the real services
      # with the committed fixture corpus so retrieval has something to find.
      # eval_gate.ingest_corpus installs no stubs at import time — it is the
      # same ingest path the PR gate uses, minus the seam patching.
      - name: Ingest fixture corpus into real services
        run: |
          python - <<'PY'
          import asyncio
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))

          from eval_gate import CORPUS_DIR, ingest_corpus

          indexed = asyncio.run(ingest_corpus(CORPUS_DIR))
          print(f"Ingested {indexed} corpus document(s) into PostgreSQL/BM25")
          PY

      - name: Run real RAGAS suite (live critic)
        run: python -m axiom.eval_suite.runner

      - name: Record nightly run summary
        if: always()
        run: |
          {
            echo "## Nightly RAGAS eval"
            echo ""
            echo "Real RAGAS with a live critic against real services."
            echo "Informational only — this is never a PR gate."
            echo "Committed deterministic thresholds live in \`backend/eval/thresholds.json\`."
          } >> "$GITHUB_STEP_SUMMARY"
