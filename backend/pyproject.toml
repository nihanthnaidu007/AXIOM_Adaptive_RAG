[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-adaptive-rag"
version = "1.5.0"
description = "Adaptive RAG pipeline with a self-correcting hallucination detection loop."
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Nihanth Naidu Kalisetti" },
]
keywords = [
    "rag",
    "langgraph",
    "hallucination-detection",
    "ragas",
    "anthropic",
    "claude",
    "pgvector",
    "bm25",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dynamic = ["dependencies"]

# OCR/table parsing is OPTIONAL (Wave 4): pdfplumber remains the digital-PDF
# default; install with `pip install '.[ocr]'` to enable Docling-backed OCR.
# Docling is a large dependency tree, so it must never ride the default install.
[project.optional-dependencies]
ocr = ["docling==2.128.0"]

[project.urls]
Homepage = "https://github.com/nihanthnaidu007/AXIOM_Adaptive_RAG"
Issues = "https://github.com/nihanthnaidu007/AXIOM_Adaptive_RAG/issues"
Source = "https://github.com/nihanthnaidu007/AXIOM_Adaptive_RAG"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["axiom*"]
exclude = ["tests*", "alembic*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501", # long prompt strings and log lines; not worth gating on
]

[tool.ruff.lint.isort]
known-first-party = ["axiom"]

[tool.ruff.lint.per-file-ignores]
# server.py loads .env before importing axiom modules — the import order is
# deliberate (config reads environment at import time).
"server.py" = ["E402"]
# export_openapi.py must seal the import-time env dummies and put the
# backend dir on sys.path before `import server` — same deliberate order.
"scripts/export_openapi.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = [
    "alembic/",
    "build/",
    # Wave-1 pragmatic gate: these legacy modules pre-date the typecheck job
    # and carry pre-existing typing debt (Optional-state flows, langgraph
    # node typing). Excluded from direct crawl and silenced via ignore_errors
    # below (mypy still analyzes excluded files when imported); everything
    # else — server.py, axiom.api_errors, axiom.db_migrations, tests — is
    # fully checked with check_untyped_defs on.
    "axiom/llm/client\\.py$",
    "axiom/graph/graph\\.py$",
    "axiom/graph/nodes/evaluate_answer\\.py$",
    "axiom/graph/nodes/decompose_query\\.py$",
    "axiom/graph/nodes/web_search_node\\.py$",
    "axiom/cache/semantic_cache\\.py$",
    "axiom/evaluation/critic_llm\\.py$",
    "axiom/retrieval/bm25_index\\.py$",
    "axiom/retrieval/reranker\\.py$",
    "axiom/eval_suite/runner\\.py$",
]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "axiom.llm.client",
    "axiom.graph.graph",
    "axiom.graph.nodes.evaluate_answer",
    "axiom.graph.nodes.decompose_query",
    "axiom.graph.nodes.web_search_node",
    "axiom.cache.semantic_cache",
    "axiom.evaluation.critic_llm",
    "axiom.retrieval.bm25_index",
    "axiom.retrieval.reranker",
    "axiom.eval_suite.runner",
]
ignore_errors = true
