services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  backend:
    # Full stack: `docker compose --profile fullstack up` wires the backend
    # to the Postgres/pgvector and Redis services above. Without the profile
    # only the infrastructure services start (previous behavior).
    build:
      context: ./backend
    profiles: ["fullstack"]
    environment:
      # Model/search keys come from the operator environment (or .env next
      # to this compose file); the service URLs point at the containers.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-axiom}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-axiom_rag}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-axiom}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-axiom_rag}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      API_KEY: ${API_KEY:?Set API_KEY — protected endpoints fail closed without it}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      USE_CLAUDE_EVALUATOR: ${USE_CLAUDE_EVALUATOR:-true}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  pgdata:
  redisdata: